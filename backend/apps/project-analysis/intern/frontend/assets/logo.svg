<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 95" width="180" height="50">
  <defs>
    <style>
      .logo-text { font-family: 'Bodoni MT', 'Didot', 'Times New Roman', serif; font-size: 88px; fill: #00a0e9; font-weight: 600; letter-spacing: -1px; }
    </style>
  </defs>
  <!-- 'Th' -->
  <text x="0" y="76" class="logo-text">Th</text>
  
  <!-- 'o' Icon Replacement -->
  <g transform="translate(98, 10)">
    <!-- Head circle -->
    <circle cx="26" cy="12" r="10" fill="#00a0e9" />
    
    <!-- Outer ring arc -->
    <path d="M 12 34 A 22 22 0 1 1 42 46" fill="none" stroke="#00a0e9" stroke-width="5.5" stroke-linecap="round" />
    
    <!-- Color dots on bottom-left arc -->
    <circle cx="10" cy="48" r="3" fill="#a0a0a0" />
    <circle cx="6" cy="57" r="3" fill="#e5007d" />
    <circle cx="11" cy="67" r="3" fill="#fff100" />
    <circle cx="20" cy="74" r="3" fill="#00b07c" />
    <circle cx="31" cy="75" r="3" fill="#e5007d" />
    <circle cx="41" cy="71" r="3" fill="#a0a0a0" />

    <!-- Person / Tie figure in center -->
    <path d="M 26 26 L 16 38 L 23 40 L 21 62 L 26 70 L 31 62 L 29 40 L 36 38 Z" fill="#00a0e9" />

    <!-- Magnifying Glass Handle -->
    <path d="M 38 52 L 56 68" stroke="#00a0e9" stroke-width="11" stroke-linecap="round" />
  </g>
  
  <!-- 'zhil' -->
  <text x="162" y="76" class="logo-text">zhil</text>
</svg>
