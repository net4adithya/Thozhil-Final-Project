name: Deploy Assessment Platform

on:
  push:
    branches:
      - main

jobs:

  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Deploy Backend
  # ─────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "=== Pulling latest code ==="
            cd /var/www/projects/assessment-platform
            git pull origin main

            echo "=== Installing backend dependencies ==="
            cd /var/www/projects/assessment-platform/assessment-backend
            npm install --omit=dev

            echo "=== Restarting API with PM2 ==="
            pm2 reload assessment-api --update-env

            echo "=== Deploy status ==="
            pm2 status

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Build & Deploy Candidate App
  # ─────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Build and Deploy Candidate App
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: assessment-frontend/package-lock.json

      - name: Install dependencies
        working-directory: assessment-frontend
        run: npm ci

      - name: Build for production
        working-directory: assessment-frontend
        run: npm run build

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "assessment-frontend/dist/*"
          target: "/var/www/projects/assessment-platform/assessment-frontend/"
          strip_components: 1

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sudo systemctl reload nginx
            echo "=== Candidate app deployed ==="

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Build & Deploy Admin App
  # ─────────────────────────────────────────────────────────────────
  deploy-admin:
    name: Build and Deploy Admin App
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: assessment-admin/package-lock.json

      - name: Install dependencies
        working-directory: assessment-admin
        run: npm ci

      - name: Build for production
        working-directory: assessment-admin
        run: npm run build

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "assessment-admin/dist/*"
          target: "/var/www/projects/assessment-platform/assessment-admin/"
          strip_components: 1

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sudo systemctl reload nginx
            echo "=== Admin app deployed ==="
